
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <p class="tag">WEEK 2 · JAVASCRIPT</p>
    <h1>My To-Do List</h1>
    <p class="subtitle">Learn JavaScript by getting things done.</p>

    <form id="todo-form">
      <input id="task-input" type="text"
        placeholder="Enter a task..." autocomplete="off">
      <button type="submit">Add Task</button>
    </form>

    <p id="message" aria-live="polite"></p>
    <ul id="task-list"></ul>
    <p class="hint">Add a task, mark it complete, or delete it.</p>
    
    <section class="api-section">
    <h2>Explore Posts</h2>
    <button id="load-posts">Load Posts</button>
    <p id="api-message" aria-live="polite"></p>
    <div id="posts"></div>
    </section>

    </main>

  <script src="script.js"></script>
</body>
</html>
